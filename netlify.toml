[build]
  publish = "public"
  functions = "netlify/functions"
[functions]
  node_bundler = "esbuild"
  included_files = ["private/**"]
[[redirects]]
  from = "/api/auth"
  to = "/.netlify/functions/auth"
  status = 200
  force = true
[[redirects]]
  from = "/"
  to = "/.netlify/functions/dashboard?file=index.html"
  status = 200
  force = true
[[redirects]]
  from = "/:file"
  to = "/.netlify/functions/dashboard?file=:file"
  status = 200
