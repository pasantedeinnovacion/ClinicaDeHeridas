<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Acceso HUN</title><link rel="stylesheet" href="./login.css"></head><body><main><img src="../public/logo.png" alt="Mascota HUN"><h1>Calidad asistencial</h1><p>Acceso al dashboard PE-ID-01</p><form id="login"><label for="email">Correo autorizado</label><input id="email" type="email" autocomplete="email" required><div id="verification" hidden><label for="code">Código de verificación</label><input id="code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" pattern="[0-9]{6}"></div><button id="submit">Enviar código</button><button id="resend" type="button" hidden>Reenviar código</button><p id="message" role="status" aria-live="polite"></p></form></main><script src="/login.js"></script></body></html>
